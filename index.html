<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Brewing Dungeon</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg-color: #0D1117; /* Deep Space Blue */
        --text-color: #C9D1D9; /* Soft Off-White */
        --heading-color: #F0F6FC; /* Bright White */
        --primary-color: #30B6A8; /* Aurora Teal */
        --secondary-color: #2CA5B4; /* Lighter Cyan */
        --accent-color: #A475F9; /* Cosmic Magenta */
        --container-bg: rgba(22, 27, 34, 0.6); /* Translucent Glass */
        --border-color: rgba(139, 148, 158, 0.2);
        --shadow-color: rgba(0, 0, 0, 0.4);
      }

      body {
        font-family: 'Montserrat', sans-serif;
        background-color: var(--bg-color);
        color: var(--text-color);
        background-image: radial-gradient(circle at 10% 10%, var(--accent-color) 0%, transparent 30%), radial-gradient(circle at 80% 90%, var(--secondary-color) 0%, transparent 40%);
        background-attachment: fixed;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      p, li {
        text-transform: none;
        letter-spacing: normal;
      }
      .font-display {
        font-family: 'Montserrat', sans-serif;
        font-weight: 300;
        color: var(--heading-color);
      }
      
      .container-aurora {
        background-color: var(--container-bg);
        border: 1px solid var(--border-color);
        border-radius: 12px;
        box-shadow: 0 0 15px rgba(48, 182, 168, 0.1), inset 0 0 8px rgba(22, 27, 34, 0.5);
        transition: box-shadow 0.3s ease, transform 0.3s ease;
        backdrop-filter: blur(10px);
      }
      .container-aurora:hover {
        box-shadow: 0 0 25px rgba(48, 182, 168, 0.2), inset 0 0 10px rgba(22, 27, 34, 0.5);
      }
      
      .btn-aurora {
        position: relative;
        overflow: hidden;
        border: 1px solid var(--border-color);
        color: var(--heading-color);
        background-color: transparent;
        transition: all 0.3s ease;
        border-radius: 8px;
        font-weight: 500;
      }
      .btn-aurora:hover {
        background-color: var(--border-color);
        transform: translateY(-2px);
        box-shadow: 0 0 10px rgba(48, 182, 168, 0.5);
      }
      .btn-aurora.active {
        background-color: var(--primary-color);
        color: #0D1117;
        border-color: var(--primary-color);
        font-weight: 700;
        box-shadow: 0 0 15px var(--primary-color);
      }
      .btn-aurora.primary {
        background-color: var(--secondary-color);
        color: #0D1117;
        border-color: var(--secondary-color);
        font-weight: 700;
      }
      .btn-aurora.primary:hover {
        background-color: var(--primary-color);
        border-color: var(--primary-color);
        box-shadow: 0 0 15px var(--primary-color);
      }
      
      input, select {
        background-color: rgba(13, 17, 23, 0.5) !important;
        border: 1px solid var(--border-color) !important;
        color: var(--text-color) !important;
        border-radius: 8px !important;
        transition: all 0.3s ease;
      }
      input:focus, select:focus {
        outline: none !important;
        box-shadow: 0 0 0 2px rgba(48, 182, 168, 0.5);
        border-color: var(--primary-color) !important;
      }
      input::placeholder {
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }

      select {
        background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%23C9D1D9' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e") !important;
      }

      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .animate-fade-in {
        animation: fadeIn 0.5s ease-out forwards;
      }
    </style>

{
